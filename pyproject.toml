[project]
name = "transport-mode-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marc Schmidt", email = "m.schmidt@waiis.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=21,<26",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "scipy-stubs~=1.17.1",
]

[project.scripts]
transport-mode-detection = "transport_mode_detection:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tmd"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
